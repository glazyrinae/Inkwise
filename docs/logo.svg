  <ellipse cx="64" cy="116" rx="7.5" ry="10" fill="#2b2540"/>
  <ellipse cx="98" cy="116" rx="7.5" ry="10" fill="#2b2540"/>
  <circle cx="66.5" cy="111.5" r="2.8" fill="#ffffff"/>
  <circle cx="100.5" cy="111.5" r="2.8" fill="#ffffff"/>
  <ellipse cx="52" cy="134" rx="8" ry="4.5" fill="#ff9fbd" opacity="0.75"/>
  <ellipse cx="110" cy="134" rx="8" ry="4.5" fill="#ff9fbd" opacity="0.75"/>
  <path d="M72 134 q9 9 18 0" fill="none" stroke="#2b2540" stroke-width="4.5" stroke-linecap="round"/>
