      <text x="180" y="168.5" text-anchor="middle" font-family="Verdana, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#e5484d" letter-spacing="0.5">ГОСТ</text>
    </g>
  </g>
  <!-- Привидение -->
  <path d="M30 196 V110 a50 50 0 0 1 100 0 V196 Q117.5 214 105 196 Q92.5 178 80 196 Q67.5 214 55 196 Q42.5 178 30 196 Z" fill="#f5f2ff" stroke="#2b2540" stroke-width="5" stroke-linejoin="round"/>
