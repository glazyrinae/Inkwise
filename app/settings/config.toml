[app]
title = "Inkwise"
version = "0.1.0"
debug = true
log_level = "INFO"
# Имена, по которым к api ходят браузер и office. Запрос с чужим именем отклоняем:
# так сайт, подменивший свой DNS на 127.0.0.1, не прочитает книгу и папки диска
hosts = ["localhost", "127.0.0.1", "api"]
# Язык интерфейса: ru или en. Им говорят оболочка, редактор office, сообщения api и
# плагины, на нём же названия новых блоков и заголовки публикации. Задают при сборке:
# make init language=en — он пишет APP__LANGUAGE в .env
language = "ru"

# Книга — папка на хосте (BOOK_DIR в .env). Блок книги — раздел, введение, заключение,
# титульный лист или свой блок — папка в её корне. Порядок задаёт номер в начале имени:
# 01-Введение, 02-Методы испытаний. Книги-источники лежат где угодно в библиотеке: путь
# library приходит из окружения, compose берёт его из LIBRARY_DIR
[book]
# Путь в контейнере, куда compose монтирует BOOK_DIR
root = "/app/book"
# Шаблон текста нового блока в корне книги: стили, поля, колонтитулы. Нет файла —
# текст начинается с пустого документа A4 на русском языке
chapter_template = "шаблон-главы.docx"
# Данные источников для ссылок в корне книги: у книги автор, заглавие, город,
# издательство, год, у веб-страницы — сайт, адрес и дата обращения. Одна запись на
# источник, общая для всех блоков
sources_file = "источники.json"
# Настройки книги, которые меняют в оболочке, в корне книги: оформление ссылок и
# MCP-сервер проверки орфографии
settings_file = "настройки.json"
# Папка источников в папке каждого блока: ссылки на книги и копии веб-страниц
sources = "источники"
# Вид блока — файл в папке блока: раздел, введение, заключение, титульный лист или
# свой блок. Файл скрытый, файла нет — это раздел
kind_file = ".вид"
# Публикация — собранная книга в корне книги: тексты блоков по порядку и список
# источников в конце
document = "Публикация.docx"
# Корзина в корне книги: «✕» уносит туда блок со всем, что в нём. Папка скрытая,
# дерево её не показывает
trash = ".корзина"
# Какие плагины включены в книге и их настройки, в корне книги. Плагина там нет —
# он включён, настройки у него по умолчанию
plugins_file = "плагины.json"
# Файлы плагинов в книге, скрытая папка в её корне, в ней по папке на плагин: файлы
# из настроек плагина (например, образец оформления) и что плагин хранит для этой книги
plugin_files = ".плагины"

# Плагины — папки в папке плагинов (PLUGINS_DIR в .env), как расширения VS Code, см.
# PLUGINS.md. Ставят и удаляют их в панели «Расширения», корзина там — [book] trash
[plugins]
# Путь в контейнере, куда compose монтирует PLUGINS_DIR
root = "/app/plugins"

# Веб-страницы, которые подключают к блокам: api скачивает их сам
[web]
# Ожидание ответа сайта, секунд
timeout = 20
# Как api представляется сайтам: многие отказывают тем, кто не похож на браузер
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"

# ONLYOFFICE Docs — сервис office в docker-compose.yml. Адрес для браузера
# OFFICE__PUBLIC_URL приходит из окружения: compose собирает его из OFFICE_PORT
[office]
# Адрес office для api внутри сети compose
internal_url = "http://office"
# Адрес api для office: по нему office скачивает файл и присылает сохранённый
api_url = "http://api:8000"
# Ожидание ответа office, секунд: сохранённый файл, содержание собранной книги. Книгу
# в 400 страниц office раскладывает по страницам около 15 секунд
timeout = 120
# Автор в комментариях и рецензировании. Без имени office при каждом открытии
# спрашивает его в окне «Введите имя для совместной работы»
author = "Автор"

# Проверка орфографии: MCP-сервер подключают в оболочке, его адрес — в настройках книги
[spelling]
# Ожидание ответа MCP-сервера, секунд
timeout = 10

# Шрифты для office: каких в нём нет, api скачивает из Google Fonts в папку шрифтов
# (FONTS_DIR в .env). Compose монтирует её и в office, тот ставит новые шрифты сам
[fonts]
# Путь в контейнере, куда compose монтирует FONTS_DIR
root = "/app/fonts"
# Ожидание ответа office и Google Fonts, секунд: каталог Google Fonts — около 3 МБ
timeout = 30
