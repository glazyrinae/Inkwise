# Разработка: dev-образ, код с хоста, автоперезагрузка при правке файлов.
services:
  api:
    build:
      target: dev
    # Свой тег на режим: иначе dev- и prod-сборки перезаписывали бы один образ
    image: writer:dev
    # Перезапуск только от правки кода api: импорт плагина в /app/plugins не должен
    # перезапускать api посреди запроса
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
       "--reload-dir", "app"]
    ports:
      - "127.0.0.1:${API_PORT:-8020}:8000"
    volumes:
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml:ro
    restart: "no"

  office:
    restart: "no"
