[project]
name = "writer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docxcompose==2.2.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    # Клиент MCP: подключение к серверу проверки орфографии
    "mcp==2.3.0",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    # Текст и свойства книг. Ветка 2.x тянет onnxruntime и numpy ради разметки страниц
    # для LLM, нам это не нужно: держим 1.x
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    # Текст статьи и её данные (заглавие, автор, сайт, дата) с веб-страницы
    "trafilatura==2.3.1",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
# Корзина плагинов: там удалённые плагины, их код не наш
extend-exclude = ["plugins/.корзина"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "BLE", "T20", "TID", "RUF", "D1"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Аннотации не откладываем: forward-ref — в кавычках."

[tool.mypy]
files = ["app"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "ruff==0.17.3",
]
